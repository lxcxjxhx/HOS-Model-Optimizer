[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hos-model-optimizer"
version = "1.0.0"
description = "HOS 小模型优化工具"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "HOS Team", email = "hos@example.com"}
]
keywords = ["llm", "optimization", "quantization", "inference", "training", "deployment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "peft>=0.5.0",
]

[project.optional-dependencies]
quantization = [
    "autoawq>=0.1.0",
    "auto-gptq>=0.5.0",
    "bitsandbytes>=0.41.0",
]
inference = [
    "llama-cpp-python>=0.2.0",
]
vllm = [
    "vllm>=0.2.0",
]
sglang = [
    "sglang>=0.1.0",
]
training = [
    "unsloth>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
all = [
    "autoawq>=0.1.0",
    "auto-gptq>=0.5.0",
    "bitsandbytes>=0.41.0",
    "llama-cpp-python>=0.2.0",
    "vllm>=0.2.0",
    "sglang>=0.1.0",
    "unsloth>=0.1.0",
]

[project.scripts]
hos-quantize = "hos_optimizer.cli:quantize_cmd"
hos-infer = "hos_optimizer.cli:infer_cmd"
hos-train = "hos_optimizer.cli:train_cmd"
hos-merge = "hos_optimizer.cli:merge_cmd"
hos-deploy = "hos_optimizer.cli:deploy_cmd"
hos-config = "hos_optimizer.cli:config_cmd"
hos-optimizer = "hos_optimizer.cli:main"

[project.urls]
Homepage = "https://github.com/lxcxjxhx/HOS-Model-Optimizer"
"Bug Reports" = "https://github.com/lxcxjxhx/HOS-Model-Optimizer/issues"
Source = "https://github.com/lxcxjxhx/HOS-Model-Optimizer"

[tool.setuptools]
packages = ["hos_optimizer"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
